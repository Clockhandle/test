<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla JS Three.js Express Setup</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Use an Import Map to tell the browser where 'three' comes from. -->
  <!-- This lets you write `import * as THREE from 'three'` in plain JS! -->
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/",
        "three-csg-ts": "https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.11/+esm"
      }
    }
  </script>

  <!-- Load your main module script -->
  <script type="module" src="main.js?v=2"></script>
</head>
<body>
  <div class="ui-overlay">
    <label for="json-upload"> Upload Mesh JSON: </label>
    <input type="file" id="json-upload" accept=".json" />
    <button id="draw-boundary-btn" style="margin-left: 10px;">Draw Boundary (Off)</button>
    <button id="export-cgal-btn" style="margin-left: 10px; background: #007bff; color: white;">Export For CGAL</button>
    <button id="stitch-mesh-btn" style="margin-left: 10px; background: #28a745; color: white;">Fast Stitch</button>
    <button id="cgal-mesh-btn" style="margin-left: 10px; background: #6f42c1; color: white;">CGAL Mesh</button>
    <input id="cgal-slope" type="number" step="0.5" min="0" placeholder="slope (5.0)" style="margin-left: 6px; width: 110px;" />
    <button id="via-solid-btn" style="margin-left: 10px; background: #c0392b; color: white;">Via Solid</button>
    <button id="via-volume-btn" style="margin-left: 6px; background: #795548; color: white;">Compute Volume</button>
    <button id="toggle-lines-btn" style="margin-left: 10px; background: #555; color: white;">Hide Lines</button>
    <button id="cut-mesh-btn" style="margin-left: 6px; background: #e67e22; color: white;">Cut Shape</button>
    <button id="split-mesh-btn" style="margin-left: 6px; background: #8e44ad; color: white;">Split Shape</button>
    <button id="fault-split-btn" style="margin-left: 6px; background: #c0392b; color: white;">Fault Split</button>
    <span style="margin-left: 14px; border-left: 1px solid #555; padding-left: 14px;">
      <select id="slice-axis" style="margin-left: 0; background:#1a1a2e; color:white; border:1px solid #555; padding:3px;">
        <option value="z+">Top (+Z)</option>
        <option value="z-">Bottom (−Z)</option>
        <option value="x+">Right (+X)</option>
        <option value="x-">Left (−X)</option>
        <option value="y+">Front (+Y)</option>
        <option value="y-">Back (−Y)</option>
      </select>
      <input id="slice-step" type="number" step="1" min="0.1" value="5" placeholder="step (m)" style="margin-left:4px; width:72px;" />
      <button id="slice-btn" style="margin-left:4px; background:#2980b9; color:white;">Slice</button>
      <button id="export-dxf-btn" disabled style="margin-left:4px; background:#27ae60; color:white; opacity:0.5;">Export DXF</button>
    </span>
    <span style="margin-left: 14px; border-left: 1px solid #555; padding-left: 14px;">
      <button id="toggle-vach-btn" style="background: #17a2b8; color: white;">Vách: On</button>
      <button id="toggle-tru-btn" style="margin-left: 6px; background: #fd7e14; color: white;">Trụ: On</button>
      <button id="build-lo-btn" style="margin-left: 10px; background: #2d6a4f; color: white;">Build Lò</button>
      <input id="lo-wall-height" type="number" min="0" step="0.5" value="0" placeholder="Wall H (m)" title="Side wall height in metres" style="margin-left:4px; width:90px;"/>
    </span>
  </div>
  <canvas id="three-canvas"></canvas>
  <div id="hover-tooltip" style="display:none; position:fixed; background:rgba(0,0,0,0.75); color:#fff; padding:5px 8px; border-radius:4px; font-size:12px; pointer-events:none; z-index:9999;"></div>
</body>
</html>
